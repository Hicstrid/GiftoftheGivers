# CI for the Gift of the Givers solution.
# Build: restore, build and run the unit tests. Package: publish the web and Functions apps and pack the Helpers library.
# SmokeTest: call the deployed GenerateTaxCertificate function using the FunctionKey secret.

trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - README.md

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  solution: Part1.sln
  testProject: GiftOfTheGivers.Tests/GiftOfTheGivers.Tests.csproj
  webProject: Part1/Part1.csproj
  functionsProject: GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj
  helpersProject: GiftOfTheGivers.Helpers/GiftOfTheGivers.Helpers.csproj
  functionsBaseUrl: https://st10455219giftofthegivers-functions.azurewebsites.net/api
  # Set to true to push a new Helpers version to the feed (the build service needs Contributor on the feed)
  publishHelpers: false
  # FunctionKey is a secret variable. It is added in the pipeline settings (Edit > Variables,
  # "Keep this value secret") and is never stored in this file.

stages:
  - stage: Build
    displayName: Restore, build and test
    jobs:
      - job: BuildAndTest
        displayName: Build and test
        steps:
          - template: pipelines/templates/restore-steps.yml
            parameters:
              solution: $(solution)

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: $(solution)
              arguments: --configuration $(buildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: $(testProject)
              arguments: --configuration $(buildConfiguration) --no-build --collect "XPlat Code Coverage"
              publishTestResults: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Agent.TempDirectory)/**/coverage.cobertura.xml

  - stage: Package
    displayName: Package
    dependsOn: Build
    jobs:
      - job: Package
        displayName: Publish apps and pack Helpers
        steps:
          - template: pipelines/templates/restore-steps.yml
            parameters:
              solution: $(solution)

          - task: DotNetCoreCLI@2
            displayName: Publish web app
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(webProject)
              arguments: --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/web
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: Publish Functions app
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(functionsProject)
              arguments: --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/functions
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: Pack GiftOfTheGivers.Helpers
            inputs:
              command: pack
              packagesToPack: $(helpersProject)
              configuration: $(buildConfiguration)
              packDirectory: $(Build.ArtifactStagingDirectory)/packages
              versioningScheme: off

          # Versions already in the feed are skipped, so only a bumped <Version> gets published
          - script: dotnet nuget push "$(Build.ArtifactStagingDirectory)/packages/*.nupkg" --source GiftOfTheGiversHelpers --api-key AzureArtifacts --skip-duplicate
            displayName: Push Helpers to Azure Artifacts
            condition: and(succeeded(), eq(variables['publishHelpers'], 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

          - task: PublishPipelineArtifact@1
            displayName: Publish build artifacts
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: drop

  - stage: SmokeTest
    displayName: Smoke test deployed function
    dependsOn: Package
    jobs:
      - job: SmokeTest
        displayName: Call GenerateTaxCertificate
        steps:
          - checkout: none

          - pwsh: |
              # Secrets are not passed to scripts automatically, so FUNCTION_KEY is mapped below
              if ([string]::IsNullOrWhiteSpace($env:FUNCTION_KEY) -or $env:FUNCTION_KEY.StartsWith('$(')) {
                Write-Host "##vso[task.logissue type=warning]The FunctionKey secret is not set, so the smoke test was skipped."
                exit 0
              }

              $url = "$(functionsBaseUrl)/GenerateTaxCertificate?amount=100&currency=ZAR&donorName=Pipeline%20Check&donationType=once-off"
              $response = Invoke-RestMethod -Uri $url -Headers @{ 'x-functions-key' = $env:FUNCTION_KEY }

              if ($response.certificateNumber -notmatch '^GOTG-\d{8}-[0-9A-F]{6}$') {
                throw "Unexpected response from the deployed function."
              }
              Write-Host "Deployed function issued certificate $($response.certificateNumber)"
            displayName: Request a tax certificate
            env:
              FUNCTION_KEY: $(FunctionKey)
